[package]
name = "arm-pl011-rs"
authors = ["周睿 <zrufo747@outlook.com>"]
description = "PL011 UART driver"
keywords = ["pl011", "no-std", "embedded-hal", "async"]
license = "MIT OR Apache-2.0"
categories = ["no-std", "embedded", "asynchronous", "hardware-support"]
repository = "https://gitee.com/zr233/arm-pl011-rs"
version = "0.1.3"
edition = "2024"

[lib]
doctest = false

[dependencies]
tock-registers = "0.9"
embedded-io = "0.6"
embedded-io-async = "0.6"
spin_on = "0.1"
bitflags = "2.6.0"

[dev-dependencies]
bare-test = "0.3"
bare-test-macros = "0.2"
byte-unit = { version = "5.1.6", default-features = false, features = ["byte"] }
log = "0.4"

[build-dependencies]
bare-test-macros = "0.2"

[[test]]
name = "test"
harness = false
